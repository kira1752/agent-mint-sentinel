name: KOL

on:
  schedule:
    - cron: '7 */2 * * *'
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Stream window seconds (scheduled runs use 3000)'
        required: false
        default: '3000'

permissions:
  contents: write

concurrency:
  group: kol
  cancel-in-progress: false

jobs:
  kol:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect KOL trades (50-min stream window)
        run: python kol_collect.py --seconds ${{ inputs.seconds || '3000' }}
      - name: Recompute KOL ratings
        run: python kol_rate.py
      - name: Commit data
        run: |
          git config user.name "sentinel"
          git config user.email "sentinel@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "kol: update trades + ratings"
            git push
          fi
